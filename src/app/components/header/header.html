<header class="fixed inset-x-0 top-0 z-50 flex w-full flex-wrap items-center gap-2 border-b border-zinc-200 bg-white/90 p-4 text-zinc-950 backdrop-blur dark:border-zinc-800 dark:bg-zinc-950/90 dark:text-white md:flex-nowrap">
  <a class="flex w-1/2 justify-start md:w-1/4 md:justify-center" href="#home" (click)="closeMenu()">
    <img class="h-auto w-1/2 max-w-36 rounded-lg" [src]="am_logo" alt="Arctic Monkeys" />
  </a>
  <button class="ml-auto rounded border border-zinc-400 px-3 py-2 md:hidden" type="button" (click)="toggleMenu()" aria-label="Abrir menú" aria-controls="main-navigation" [attr.aria-expanded]="menuOpen">Menu</button>
  <nav id="main-navigation" class="w-full md:flex md:w-3/4 md:justify-center" [class.hidden]="!menuOpen">
    <ul class="flex flex-col items-center gap-4 text-center font-['Bebas_Neue'] text-xl uppercase tracking-widest md:flex-row md:gap-8 md:text-2xl">
      <li><a class="block px-3 py-2 transition-colors hover:text-amber-500" href="#home" (click)="closeMenu()">Home</a></li>
      <li><a class="block px-3 py-2 transition-colors hover:text-amber-500" href="#members" (click)="closeMenu()">Members</a></li>
      <li><a class="block px-3 py-2 transition-colors hover:text-amber-500" href="#albums" (click)="closeMenu()">Albums/Singles</a></li>
      <li><a class="block px-3 py-2 transition-colors hover:text-amber-500" href="#history" (click)="closeMenu()">History</a></li>
      <li><button type="button" class="px-3 py-2 text-sm font-sans tracking-normal hover:text-amber-500" (click)="toggleTheme.emit()">{{ isDark() ? 'Modo claro' : 'Modo oscuro' }}</button></li>
    </ul>
  </nav>
</header>
