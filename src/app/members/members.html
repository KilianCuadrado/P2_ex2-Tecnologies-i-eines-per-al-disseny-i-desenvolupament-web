
<section>
    <h2>Arctic Monkeys</h2>
    <article class="bandMember">
        @for(member of members; track member.name){
            <img [src]="member.image" [alt]="'Foto de ' + member.name" loading="lazy" class="h-56 w-full object-cover" />
            <div class="p-6">
                <h3 class="font-['Bebas_Neue'] text-2xl uppercase tracking-wider">{{ member.name }}</h3>
                <p class="mt-2 font-semibold text-amber-600 dark:text-amber-300">{{ member.role }}</p>
                <p class="mt-3 text-sm leading-6 text-zinc-600 dark:text-zinc-400">{{ member.description }}</p>
            </div>
        }
    </article>
</section>
<section>
    <h2>The Last Shadow Puppets</h2>

</section>
